name: Release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
permissions:
  contents: read
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          crate_version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"
          if [ "v${crate_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml v${crate_version}" >&2
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Archive name
        shell: bash
        run: |
          version="v$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"
          echo "NAME=just-fetch-${version}-${{ matrix.target }}" >> "$GITHUB_ENV"
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir "${NAME}"
          cp "target/${{ matrix.target }}/release/just-fetch" README.md LICENSE-MIT LICENSE-APACHE "${NAME}/"
          tar -czf "${NAME}.tar.gz" "${NAME}"
      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory $env:NAME | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/just-fetch.exe", "README.md", "LICENSE-MIT", "LICENSE-APACHE" $env:NAME
          Compress-Archive -Path $env:NAME -DestinationPath "$env:NAME.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            just-fetch-*.tar.gz
            just-fetch-*.zip
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target }}
          path: dist
      - name: Unpack and run on its own platform
        shell: bash
        run: |
          crate_version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"
          name="just-fetch-v${crate_version}-${{ matrix.target }}"
          cd dist
          if [ "${RUNNER_OS}" = "Windows" ]; then
            pwsh -NoProfile -Command "Expand-Archive -Path '${name}.zip' -DestinationPath ."
            exe="${name}/just-fetch.exe"
          else
            tar -xzf "${name}.tar.gz"
            exe="${name}/just-fetch"
          fi
          for f in README.md LICENSE-MIT LICENSE-APACHE; do
            test -f "${name}/${f}" || { echo "missing ${f} in the archive" >&2; exit 1; }
          done
          uname -m
          git --version
          got="$("./${exe}" --version)"
          if [ "${got}" != "just-fetch ${crate_version}" ]; then
            echo "--version printed '${got}'" >&2
            exit 1
          fi
          mkdir empty && "./${exe}" empty
          row="$("./${exe}" "${GITHUB_WORKSPACE}")"
          echo "${row}"
          case "${row}" in
            *"error:"*) echo "git could not read the checkout" >&2; exit 1 ;;
          esac

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
