[package]
name = "just-fetch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Finds which local clones are out of step with their remotes, and fetches the ones you pick"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kihyun1998/just-fetch"
readme = "README.md"
keywords = ["git", "fetch", "fast-forward", "cli", "repositories"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tempfile = "3"
console = "0.15"
dialoguer = "0.11"
dirs = "7"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
portable-pty = "0.9"

[profile.release]
strip = true
lto = true
